services:
  - type: web
    name: agent-starter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MOCK_AGENT
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: RAG_EMBEDDING_PROVIDER
        value: tfidf
    healthCheckPath: /api/travel/health
