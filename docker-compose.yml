services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      MOCK_AGENT: "${MOCK_AGENT:-true}"
      HOST: "0.0.0.0"
      PORT: "3000"
      TRAVEL_DB_PATH: "/app/packages/data/travel.db"
      RAG_EMBEDDING_PROVIDER: "${RAG_EMBEDDING_PROVIDER:-tfidf}"
      # 可选：覆盖镜像内 config/google-oauth.team.json；生产务必设置 JWT_SECRET
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - travel-data:/app/data
    restart: unless-stopped

volumes:
  travel-data:
